name: ECS Blue-Green Deployment

on:
  workflow_run:
    workflows: ["Build, Scan, and Push to Registries"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      image-tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: myapp-cluster
  ECS_SERVICE: myapp-service
  CONTAINER_NAME: myapp-container
  TASK_DEFINITION_FAMILY: myapp-task

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  prepare-deployment:
    name: Prepare Blue-Green Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}
      environment: ${{ steps.get-env.outputs.environment }}

    steps:
      - name: Determine environment
        id: get-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Get image tag
        id: get-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  deploy-to-ecs:
    name: Deploy to ECS (${{ needs.prepare-deployment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: prepare-deployment
    environment:
      name: ${{ needs.prepare-deployment.outputs.environment }}
      url: ${{ steps.deployment.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-ECS-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        id: download-taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > task-definition.json

          echo "Current task definition downloaded"
          cat task-definition.json | jq .

      - name: Fill in the new image ID in the task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.CONTAINER_NAME }}:${{ needs.prepare-deployment.outputs.image-tag }}

      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ needs.prepare-deployment.outputs.environment }}',
              required_contexts: [],
              auto_merge: false,
              description: 'ECS Blue-Green deployment'
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to ECS'
            });

            return deployment.data.id;

      - name: Deploy to Amazon ECS with Blue-Green strategy
        id: ecs-deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: appspec.yaml
          codedeploy-application: ${{ env.ECS_SERVICE }}-codedeploy-app
          codedeploy-deployment-group: ${{ env.ECS_SERVICE }}-deployment-group

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully"
          echo "Service: ${{ env.ECS_SERVICE }}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Task Definition: ${{ steps.ecs-deploy.outputs.task-definition-arn }}"

          # Get service details
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].[serviceName,status,runningCount,desiredCount]' \
            --output table

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Deployment completed successfully',
              environment_url: 'https://myapp.example.com'
            });

      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment failed'
            });

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-to-ecs
    if: failure()

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-ECS-Rollback
          aws-region: ${{ env.AWS_REGION }}

      - name: Initiate rollback
        run: |
          echo "Deployment failed. Initiating rollback..."

          # Get the CodeDeploy deployment ID
          DEPLOYMENT_ID=$(aws deploy list-deployments \
            --application-name ${{ env.ECS_SERVICE }}-codedeploy-app \
            --deployment-group-name ${{ env.ECS_SERVICE }}-deployment-group \
            --query 'deployments[0]' \
            --output text)

          if [ ! -z "$DEPLOYMENT_ID" ]; then
            echo "Stopping deployment: $DEPLOYMENT_ID"
            aws deploy stop-deployment \
              --deployment-id $DEPLOYMENT_ID \
              --auto-rollback-enabled
          fi

      - name: Notify team
        if: always()
        run: |
          echo "Rollback completed. Please investigate the deployment failure."
