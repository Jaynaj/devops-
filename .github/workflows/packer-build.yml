name: Packer Image Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packer/**'
      - '.github/workflows/packer-build.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packer/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (aws, azure, both)'
        required: true
        type: choice
        options:
          - aws
          - azure
          - both
      environment:
        description: 'Environment tag'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      app_version:
        description: 'Application version'
        required: true
        type: string
        default: '1.0.0'

env:
  PACKER_VERSION: '1.10.0'
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  validate-packer:
    name: Validate Packer Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Initialize Packer (AWS)
        run: |
          cd packer/aws
          packer init .

      - name: Validate Packer template (AWS)
        run: |
          cd packer/aws
          packer validate aws-ami.pkr.hcl

      - name: Initialize Packer (Azure)
        run: |
          cd packer/azure
          packer init .

      - name: Validate Packer template (Azure)
        run: |
          cd packer/azure
          packer validate azure-image.pkr.hcl

      - name: Format check
        run: |
          packer fmt -check -recursive packer/ || {
            echo "Packer files need formatting. Run: packer fmt -recursive packer/"
            exit 1
          }

  build-aws-ami:
    name: Build AWS AMI
    runs-on: ubuntu-latest
    needs: validate-packer
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'aws' || github.event.inputs.platform == 'both')) ||
      (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-Packer-Build
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Packer
        run: |
          cd packer/aws
          packer init .

      - name: Build AWS AMI
        run: |
          cd packer/aws

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          APP_VERSION="${{ github.event.inputs.app_version || '1.0.0' }}"

          packer build \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "environment=${ENVIRONMENT}" \
            -var "app_version=${APP_VERSION}" \
            -color=false \
            -timestamp-ui \
            aws-ami.pkr.hcl

      - name: Upload AMI manifest
        uses: actions/upload-artifact@v4
        with:
          name: aws-ami-manifest
          path: packer/aws/manifest.json
          retention-days: 30

      - name: Parse and output AMI details
        run: |
          if [ -f packer/aws/manifest.json ]; then
            echo "### AWS AMI Build Success :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            AMI_ID=$(jq -r '.builds[0].artifact_id | split(":")[1]' packer/aws/manifest.json)
            AMI_NAME=$(jq -r '.builds[0].custom_data.ami_name' packer/aws/manifest.json)
            REGION=$(jq -r '.builds[0].builder_type' packer/aws/manifest.json)

            echo "**AMI Details:**" >> $GITHUB_STEP_SUMMARY
            echo "- AMI ID: \`${AMI_ID}\`" >> $GITHUB_STEP_SUMMARY
            echo "- AMI Name: \`${AMI_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Region: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Environment: \`${{ github.event.inputs.environment || 'dev' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- App Version: \`${{ github.event.inputs.app_version || '1.0.0' }}\`" >> $GITHUB_STEP_SUMMARY

            echo "AMI_ID=${AMI_ID}" >> $GITHUB_OUTPUT
          fi

  build-azure-image:
    name: Build Azure VM Image
    runs-on: ubuntu-latest
    needs: validate-packer
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'azure' || github.event.inputs.platform == 'both')) ||
      (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group for Packer (if not exists)
        run: |
          az group create \
            --name packer-images-rg \
            --location eastus \
            || echo "Resource group already exists"

      - name: Initialize Packer
        run: |
          cd packer/azure
          packer init .

      - name: Build Azure Image
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          cd packer/azure

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          APP_VERSION="${{ github.event.inputs.app_version || '1.0.0' }}"

          # Use Azure CLI auth instead of service principal
          packer build \
            -var "environment=${ENVIRONMENT}" \
            -var "app_version=${APP_VERSION}" \
            -color=false \
            -timestamp-ui \
            azure-image.pkr.hcl

      - name: Upload Azure manifest
        uses: actions/upload-artifact@v4
        with:
          name: azure-image-manifest
          path: packer/azure/manifest.json
          retention-days: 30

      - name: Parse and output Image details
        run: |
          if [ -f packer/azure/manifest.json ]; then
            echo "### Azure Image Build Success :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            IMAGE_NAME=$(jq -r '.builds[0].custom_data.image_name' packer/azure/manifest.json)

            echo "**Image Details:**" >> $GITHUB_STEP_SUMMARY
            echo "- Image Name: \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Resource Group: \`packer-images-rg\`" >> $GITHUB_STEP_SUMMARY
            echo "- Environment: \`${{ github.event.inputs.environment || 'dev' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- App Version: \`${{ github.event.inputs.app_version || '1.0.0' }}\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Azure logout
        if: always()
        run: az logout

  security-scan:
    name: Security Scan Images
    runs-on: ubuntu-latest
    needs: [build-aws-ami, build-azure-image]
    if: always() && (needs.build-aws-ami.result == 'success' || needs.build-azure-image.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan provisioning scripts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'packer/scripts'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Security scan summary
        run: |
          echo "### Packer Security Scan Complete :shield:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All provisioning scripts have been scanned for security issues." >> $GITHUB_STEP_SUMMARY

  notify:
    name: Build Complete Notification
    runs-on: ubuntu-latest
    needs: [build-aws-ami, build-azure-image]
    if: always()

    steps:
      - name: Build summary
        run: |
          echo "### Packer Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AWS AMI | ${{ needs.build-aws-ami.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Azure Image | ${{ needs.build-azure-image.result }} |" >> $GITHUB_STEP_SUMMARY
